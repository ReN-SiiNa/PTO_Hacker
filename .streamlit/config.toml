# Theme values come from the validated reference palette (dataviz skill).
#
# Light: categorical slots 1-3 #2a78d6 / #eb6834 / #1baf7a
#        validate_palette.py --pairs all --mode light  -> all checks PASS,
#        with a contrast WARN on aqua (2.74:1). Mitigated: anything aqua also
#        carries a visible text label, so colour is never the only channel.
# Dark:  the SAME hues re-stepped for the dark surface, not an automatic flip:
#        #3987e5 / #d95926 / #199e70 against surface #1a1a19
#        validate_palette.py --pairs all --mode dark --surface #1a1a19
#        -> all checks PASS, including contrast (all three clear 3:1).
#
# Both themes ship. Streamlit picks one from the viewer's OS setting, and the
# app menu (Settings -> Appearance) overrides it. ui.py reads the active theme
# via st.context.theme.type and injects the matching custom-property set.

[theme]
# Shared across both themes.
font = "Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
headingFont = "Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, monospace"
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
# chartCategoricalColors is top-level only -- Streamlit has no per-mode chart
# palette. The one chart in the app passes its colour explicitly via
# ui.c("series_1"), so it gets the right step for the active theme anyway.
chartCategoricalColors = [
    "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#6250d6", "#e34948",
]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"          # chart surface
secondaryBackgroundColor = "#f2f1ec"
textColor = "#0b0b0b"                # primary ink
linkColor = "#2a78d6"
borderColor = "#e1e0d9"              # hairline
dataframeHeaderBackgroundColor = "#f2f1ec"

[theme.light.sidebar]
backgroundColor = "#f9f9f7"          # page plane: the sidebar recedes
secondaryBackgroundColor = "#f2f1ec"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"          # dark chart surface
secondaryBackgroundColor = "#242422"
textColor = "#f0efec"                # primary ink, dark
linkColor = "#3987e5"
borderColor = "#2c2c2a"              # gridline / hairline, dark
dataframeHeaderBackgroundColor = "#242422"

[theme.dark.sidebar]
backgroundColor = "#0d0d0d"          # dark page plane
secondaryBackgroundColor = "#242422"
borderColor = "#2c2c2a"

[browser]
# Streamlit's usage telemetry defaults to ON. This app is meant to run on your
# own machine or your own server with nothing phoning home, so it is off here --
# in config, so it applies to `streamlit run` too, not only the container.
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
